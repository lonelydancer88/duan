const PAGE = 20;
let selected = new Set();
let cur = 1;
let lastPages = Math.max(1, Math.ceil(MANIFEST.total / PAGE));
const shardCache = new Map();
let allPromise = null, loadedAll = null, reqSeq = 0, qTimer = null;

function toggleTag(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  document.querySelector('.tag[data-id="'+id+'"]').classList.toggle('on', selected.has(id));
  apply();
}
function preset(ids) { clearAll(false); ids.forEach(id => {
  const el=document.querySelector('.tag[data-id="'+id+'"]');
  if(el){ selected.add(id); el.classList.add('on'); }
}); apply(); }
function clearAll(doRender=true) {
  selected.clear();
  document.querySelectorAll('.tag.on').forEach(e=>e.classList.remove('on'));
  document.getElementById('q').value='';
  document.getElementById('year').value='';
  document.getElementById('month').value='';
  if(doRender) apply();
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function status(msg){ document.getElementById('status').innerHTML = msg || ''; }
function offline(){ return location.protocol === 'file:'; }

function loadShard(i) {
  if (!shardCache.has(i)) {
    const url = "data/" + MANIFEST.shards[i].f + "?v=" + MANIFEST.v;
    shardCache.set(i, fetch(url).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).catch(function(e){ shardCache.delete(i); throw e; }));
  }
  return shardCache.get(i);
}
function fetchRange(from, to) {
  from = Math.max(0, from); to = Math.min(MANIFEST.total, to);
  if (to <= from) return Promise.resolve([]);
  const idx = [];
  for (let i=0;i<MANIFEST.shards.length;i++) {
    const s = MANIFEST.shards[i];
    if (s.from < to && s.to > from) idx.push(i);
  }
  if (!idx.length) return Promise.resolve([]);
  return Promise.all(idx.map(loadShard)).then(function(parts){
    const merged = [].concat.apply([], parts);
    const base = MANIFEST.shards[idx[0]].from;
    return merged.slice(from - base, to - base);
  });
}
function fetchAll() {
  if (!allPromise) {
    allPromise = fetchRange(0, MANIFEST.total).then(function(rows){
      loadedAll = rows; return rows;
    }).catch(function(e){ allPromise = null; throw e; });
  }
  return allPromise;
}
function ymRange(y, m) {
  if (!y) return [0, MANIFEST.total];
  if (m) {
    const v = MANIFEST.ym[y + '-' + m];
    if (!v) return [0, 0];
    const s = MANIFEST.shards[v[0]];
    return [s.from + v[1], s.from + v[2]];
  }
  const keys = Object.keys(MANIFEST.ym).filter(k=>k.slice(0,4)===y).sort();
  if (!keys.length) return [0, 0];
  const a = MANIFEST.ym[keys[0]], b = MANIFEST.ym[keys[keys.length-1]];
  return [MANIFEST.shards[a[0]].from + a[1], MANIFEST.shards[b[0]].from + b[2]];
}
function filterRows(all, y, m, q) {
  const byGroup = {};
  selected.forEach(id=>{
    const g = TAGMETA[id].group;
    (byGroup[g]=byGroup[g]||[]).push(id);
  });
  return all.filter(r=>{
    if (selected.size) {
      const rset = new Set(r.tags);
      for (const g in byGroup) {
        if (!byGroup[g].some(id=>rset.has(id))) return false;
      }
    }
    if(y && (r.date||'').slice(0,4)!==y) return false;
    if(m && (r.date||'').slice(5,7)!==m) return false;
    if(q) {
      const s=((r.text||'')+' '+(r.retweeted_text||'')).toLowerCase();
      if(!s.includes(q)) return false;
    }
    return true;
  });
}
function paint(rows, total, asc, scroll) {
  const pages=Math.max(1,Math.ceil(total/PAGE));
  if(cur>pages) cur=pages;
  lastPages = pages;
  document.getElementById('count').textContent='匹配 '+total+' 条 · 共 '+pages+' 页 · 当前第 '+cur+' 页';
  const slice=rows;
  let lastYM='';
  document.getElementById('list').innerHTML = slice.length ? slice.map(r=>{
    const ym=(r.date||'').slice(0,7);
    let ymhead='';
    if(ym && ym!==lastYM) { lastYM=ym; ymhead='<div class="ymhead">'+ym.slice(0,4)+' 年 '+parseInt(ym.slice(5,7),10)+' 月</div>'; }
    const badges=(r.tags||[]).slice(0,8).map(id=>{
      const t=TAGMETA[id];
      return '<span class="badge '+(t&&t.group==='company'?'co':'')+'">'+esc(t?t.name:id)+'</span>';
    }).join('');
    const imgs=(r.images||[]).map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img class="postimg" src="'+esc(u)+'!small" loading="lazy" alt="配图"></a>').join('');
    const rtitle=r.retweeted_title?'<b>'+esc(r.retweeted_title)+'</b><br>':'';
    const rtlink=r.retweeted_id?'<a class="src" href="https://xueqiu.com/1247347556/'+r.retweeted_id+'" target="_blank" rel="noopener">查看原文 ↗</a>':'';
    const rt=(r.retweeted_text||r.retweeted_title) ? '<div class="rt">转发自 @'+esc(r.retweeted_user||'')+'：'+rtitle+esc((r.retweeted_text||'').slice(0,600))+' '+rtlink+'</div>' : '';
    const link=r.id ? '<a class="src" href="https://xueqiu.com/1247347556/'+r.id+'" target="_blank" rel="noopener">查看原帖 ↗</a>' : '';
    return ymhead+'<div class="card"><div class="meta"><span class="date">'+esc((r.date||'').slice(0,16))+'</span>'+badges+'</div>'+
      '<div class="body">'+esc(r.text||'')+'</div>'+(imgs?'<div class="imgs">'+imgs+'</div>':'')+rt+'<div>'+link+'</div></div>';
  }).join('') : '<div class="empty">这一组条件下没有言论，换个标签试试。</div>';
  document.getElementById('pager').innerHTML=
    '<button class="btn" onclick="go(-1)">← 上一页</button>'+
    '<span class="pinfo">第 '+cur+' / '+pages+' 页</span>'+
    '<button class="btn" onclick="go(1)">下一页 →</button>'+
    '<input id="pagejump" type="number" min="1" max="'+pages+'" value="'+cur+'" onkeydown="if(event.key===\'Enter\')jump()">'+
    '<button class="btn" onclick="jump()">跳转</button>';
  if(scroll !== false) window.scrollTo(0,0);
}

async function refresh() {
  const my = ++reqSeq;
  const y=document.getElementById('year').value;
  const m=document.getElementById('month').value;
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const asc=document.getElementById('sort').value==='asc';
  const needsFull = selected.size > 0 || !!q;
  if (offline() && needsFull) {
    status('本地文件模式无法加载全部分片。<a href="https://lonelydancer88.github.io/duan/duanyongping_tags.html">访问在线版</a>使用标签筛选。');
    return;
  }
  try {
    let total, rows;
    if (needsFull) {
      if (!loadedAll) status('首次筛选需加载全部数据（约 12 MB），稍候…');
      const all = await fetchAll();
      if (my !== reqSeq) return;
      const found = filterRows(all, y, m, q);
      if (asc) found.reverse();
      total = found.length;
      rows = found.slice((cur-1)*PAGE, cur*PAGE);
    } else {
      const range = ymRange(y, m);
      total = range[1] - range[0];
      const from = asc ? range[1] - cur*PAGE : range[0] + (cur-1)*PAGE;
      const to = asc ? range[1] - (cur-1)*PAGE : range[0] + cur*PAGE;
      rows = await fetchRange(from, to);
      if (my !== reqSeq) return;
      if (asc) rows = rows.slice().reverse();
    }
    if (my !== reqSeq) return;
    status('');
    paint(rows, total, asc);
  } catch(e) {
    if (my === reqSeq) status('<span class="err">加载失败：'+esc(e.message)+'</span><button onclick="refresh()">重试</button>');
  }
}
function go(d){ const v=cur+d; if(v<1||v>lastPages) return; cur=v; refresh(); }
function jump(){ const v=parseInt(document.getElementById('pagejump').value,10);
  if(!isNaN(v)) cur=Math.max(1,Math.min(v,lastPages)); refresh(); }
function apply(){ cur=1; refresh(); }

document.getElementById('q').addEventListener('input', function(){
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){ cur=1; refresh(); }, 300);
});
paint(FIRST_PAGE, MANIFEST.total, false, false);
if (!offline()) loadShard(0);
</script>

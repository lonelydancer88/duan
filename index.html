const shardCache = new Map();
let allPromise = null, loadedAll = null, reqSeq = 0, qTimer = null;
document.getElementById("total").textContent = MANIFEST.total;

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hl(s, q){ if(!q) return esc(s);
  const re = new RegExp("("+q.replace(/[.*+?^${}()|[]\\]/g,"\\$&")+")","gi");
  return esc(s).replace(re,"<mark>$1</mark>"); }
function fmt(n){ n=n||0; return n>=10000?(n/10000).toFixed(1)+"w":n; }
function status(msg, isErr){ document.getElementById("status").innerHTML = msg || ""; }
function offline(){ return location.protocol === "file:"; }

function loadShard(i) {
  if (!shardCache.has(i)) {
    const url = "data/" + MANIFEST.shards[i].f + "?v=" + MANIFEST.v;
    shardCache.set(i, fetch(url).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).catch(function(e){ shardCache.delete(i); throw e; }));
  }
  return shardCache.get(i);
}
function fetchRange(from, to) {
  from = Math.max(0, from); to = Math.min(MANIFEST.total, to);
  if (to <= from) return Promise.resolve([]);
  const idx = [];
  for (let i=0;i<MANIFEST.shards.length;i++) {
    const s = MANIFEST.shards[i];
    if (s.from < to && s.to > from) idx.push(i);
  }
  if (!idx.length) return Promise.resolve([]);
  return Promise.all(idx.map(loadShard)).then(function(parts){
    const merged = [].concat.apply([], parts);
    const base = MANIFEST.shards[idx[0]].from;
    return merged.slice(from - base, to - base);
  });
}
function fetchAll() {
  if (!allPromise) {
    allPromise = fetchRange(0, MANIFEST.total).then(function(rows){
      loadedAll = rows; return rows;
    }).catch(function(e){ allPromise = null; throw e; });
  }
  return allPromise;
}
function readFilters() {
  return {
    q: document.getElementById("q").value.trim().toLowerCase(),
    y: document.getElementById("year").value,
    m: document.getElementById("month").value,
    cls: curCls,
    asc: curSort === "asc"
  };
}
function needsAll(f){ return !!(f.q || f.y || f.m || f.cls); }

function paint(rows, total, f, scroll) {
  const pages = Math.max(1, Math.ceil(total/PAGE));
  if(cur>pages) cur=pages; if(cur<1) cur=1;
  lastPages = pages;
  const q = document.getElementById("q").value.trim();
  const list = document.getElementById("list");
  list.innerHTML = rows.map(r => {
    const badge = r.class==="original"
      ? '<span class="badge original">原创</span>'
      : '<span class="badge repost_comment">转发附言</span>';
    const imgs = (r.images||[]).map(u =>
      `<a href="${esc(u)}" target="_blank" rel="noopener"><img class="postimg" src="${esc(u)}!small" loading="lazy" alt="配图" onclick="event.preventDefault();window.open(this.parentNode.href,'_blank')"></a>`).join("");
    const rtTitle = r.retweeted_title ? `<b>${esc(r.retweeted_title)}</b><br>` : "";
    const rtLink = r.retweeted_id ? `<a class="src" href="https://xueqiu.com/${r.retweeted_user?'':'1247347556/'}${r.retweeted_id}" target="_blank" rel="noopener">查看原文 ↗</a>` : "";
    const quote = (r.class==="repost_comment" && (r.retweeted_text||r.retweeted_title))
      ? `<div class="quote"><b>转发自 @${esc(r.retweeted_user)}：</b>${rtTitle}${hl((r.retweeted_text||"").slice(0,600), q)} ${rtLink}</div>` : "";
    return `<div class="card">
      <div class="meta">${badge}<span>${esc(r.date)}</span>
        ${r.id?('<a class="src" href="https://xueqiu.com/1247347556/'+r.id+'" target="_blank" rel="noopener">雪球原文 ↗</a>'):""}
        ${r.source?("<span>· "+esc(r.source)+"</span>"):""}</div>
      <div class="text">${hl(r.text, q)}</div>${imgs?('<div class="imgs">'+imgs+'</div>'):""}${quote}
      <div class="stats"><span>♥ ${fmt(r.like_count)}</span><span>💬 ${fmt(r.reply_count)}</span>
        <span>↻ ${fmt(r.retweet_count)}</span></div>
    </div>`;
  }).join("") || '<p style="color:#6b7280;text-align:center;padding:30px">没有匹配的结果</p>';
  document.getElementById("count").textContent = "共 "+total+" 条匹配";
  document.getElementById("pageinfo").textContent = "第 "+cur+" / "+pages+" 页";
  document.getElementById("prev").disabled = cur<=1;
  document.getElementById("next").disabled = cur>=pages;
  const pj = document.getElementById("pagejump");
  pj.max = pages;
  if(document.activeElement !== pj) pj.value = cur;
  if(scroll !== false) window.scrollTo({top:0,behavior:"smooth"});
}

async function refresh() {
  const my = ++reqSeq;
  const f = readFilters();
  if (offline() && needsAll(f)) {
    status('本地文件模式无法加载全部分片。<a href="https://lonelydancer88.github.io/duan/">访问在线版</a>使用搜索和筛选。');
    return;
  }
  try {
    let total, rows;
    if (needsAll(f)) {
      if (!loadedAll) status("首次筛选需加载全部数据（约 12 MB），稍候…");
      const all = await fetchAll();
      if (my !== reqSeq) return;
      const found = all.filter(r => {
        if(f.cls && r.class!==f.cls) return false;
        if(f.y && (r.date||"").slice(0,4)!==f.y) return false;
        if(f.m && (r.date||"").slice(5,7)!==f.m) return false;
        if(f.q) {
          const hay=(r.text+" "+(r.retweeted_text||"")+" "+(r.retweeted_user||"")).toLowerCase();
          if(!hay.includes(f.q)) return false;
        }
        return true;
      });
      if(f.asc) found.reverse();
      total = found.length;
      rows = found.slice((cur-1)*PAGE, cur*PAGE);
    } else {
      total = MANIFEST.total;
      const from = f.asc ? total - cur*PAGE : (cur-1)*PAGE;
      const to = f.asc ? total - (cur-1)*PAGE : cur*PAGE;
      rows = await fetchRange(from, to);
      if (my !== reqSeq) return;
      if(f.asc) rows = rows.slice().reverse();
    }
    if (my !== reqSeq) return;
    status("");
    paint(rows, total, f);
  } catch(e) {
    if (my === reqSeq) status('<span class="err">加载失败：'+esc(e.message)+'</span><button onclick="refresh()">重试</button>');
  }
}
function apply(){ cur=1; refresh(); }
function setCls(c){ curCls=c; document.getElementById("b-all").classList.toggle("on",c==="");
  document.getElementById("b-orig").classList.toggle("on",c==="original");
  document.getElementById("b-rep").classList.toggle("on",c==="repost_comment"); apply(); }
function setSort(s){ curSort=s; document.getElementById("b-new").classList.toggle("on",s==="desc");
  document.getElementById("b-old").classList.toggle("on",s==="asc"); apply(); }
function go(d){ const v=cur+d; if(v<1||v>lastPages) return; cur=v; refresh(); }
function jump(){ const pj=document.getElementById("pagejump"); let v=parseInt(pj.value,10);
  if(isNaN(v)) v=cur; if(v<1) v=1; if(v>lastPages) v=lastPages;
  cur=v; pj.value=v; refresh(); }

document.getElementById("q").addEventListener("input", function(){
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){ cur=1; refresh(); }, 300);
});
paint(FIRST_PAGE, MANIFEST.total, readFilters(), false);
if (!offline()) loadShard(0);
</script>
</body>
</html>
